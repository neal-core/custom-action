name: Test Action
description: My very first GitHub action

inputs:
  username:
    default: Me
    description: The username to be greeted
    required: true

outputs:
  greeting:
    description: The greeting message
    value: ${{steps.greet.outputs.greeting}}
runs:
  using: composite
  steps:
    - name: Say hi
      id: greet
      shell: bash
      env:
        INPUT_NAME: ${{inputs.username}}
      run: |
        greeting=$(${{github.action_path}}/shellexec.sh)
        "greeting=$greeting" >> "$GITHUB_OUTPUT"
    - name: Continuous
      shell: bash
      run: echo "Nice to meet you"
